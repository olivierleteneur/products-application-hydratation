<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>myGalaxy</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="myGalaxy — accès rapide à mes projets" />
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>myGalaxy</h1>
        <p class="subtitle">Choisis un projet — tout est classé par dossier.</p>
      </div>

      <div class="controls">
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2" opacity=".9"/>
            <path d="M16.2 16.2 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".9"/>
          </svg>
          <input id="q" type="search" placeholder="Rechercher un projet..." autocomplete="off" />
        </div>
        <div class="pill" id="count">0 projet</div>
      </div>
    </header>

    <main class="grid" id="grid">
      </main>

    <footer>
      <div>Astuce : tape “di” pour trouver DIY.</div>
      <div>© <span id="year"></span> myGalaxy</div>
    </footer>
  </div>

  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
