<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#EEF5F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1C1D" media="(prefers-color-scheme: dark)">
  <title>Hydration — Suivi d'eau</title>
  <link rel="preload" href="assets/charte/fonts/gabarito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/charte/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/charte/fonts.css">
  <link rel="stylesheet" href="assets/charte/tokens.css">
  <link rel="stylesheet" href="assets/charte/base.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app">

  <div class="header">
    <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c3.6 4.3 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.4-6.7 6-11Z"/></svg>
    <h1>Hydration</h1>
    <div class="date" id="dateLabel"></div>
  </div>

  <div class="progress-section">
    <div class="progress-row">
      <span class="current-vol" id="currentMl">0 ml</span>
      <span class="goal-vol" id="goalMl"></span>
    </div>
    <div class="bar-bg" id="bar" role="progressbar" aria-label="Objectif du jour" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="bar-fill" id="barFill">
        <span class="bar-pct" id="barPct"></span>
      </div>
    </div>
    <div class="remaining-row">
      <div class="remaining-dot"></div>
      <span id="remainingLabel" aria-live="polite"></span>
    </div>
  </div>

  <div class="notif-banner" id="notifBanner" hidden>
    <span id="notifText"></span>
    <button id="notifBtn" type="button">Activer</button>
  </div>

  <div class="section-label">Ajouter une consommation</div>
  <div class="vol-grid" id="volGrid"></div>

  <div class="history-section">
    <div class="history-header">
      <span>Aujourd'hui</span>
      <button class="clear-link" id="resetBtn" type="button">Remettre à zéro</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="footer">Remise à zéro automatique à minuit</div>
</div>
</body>
</html>
